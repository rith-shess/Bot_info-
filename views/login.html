<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Telegram Catalog Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/public/css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">
          <i class="fa-brands fa-telegram"></i>
        </div>
        <h1>Admin Portal</h1>
        <p>Telegram Product Catalog & Dashboard</p>
      </div>

      <div id="alertBox" class="alert-box" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username"><i class="fa-solid fa-user"></i> Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter admin username" 
            required 
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Enter password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="toggle-password" tabindex="-1">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-login">
          <span class="btn-text">Sign In</span>
          <span class="spinner" style="display: none;">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
          </span>
        </button>
      </form>

      <div class="login-footer">
        <p><i class="fa-solid fa-shield-halved"></i> Protected administrative area</p>
      </div>
    </div>
  </div>

  <script src="/public/js/auth.js"></script>
</body>
</html>
